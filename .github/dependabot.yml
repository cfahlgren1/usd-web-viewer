version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /packages/viewer
      - /examples/vite
    schedule:
      interval: weekly
    groups:
      three:
        patterns:
          - three
          - "@types/three"
  - package-ecosystem: cargo
    directory: /packages/viewer
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
