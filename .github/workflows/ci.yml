name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: packages/viewer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/viewer
          # PR runs restore main's cache but don't save their own, which would evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/viewer/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      # cargo test and clippy, build:wasm (and its committed .d.ts), vitest.
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Vite example
        working-directory: examples/vite
        run: npm ci && node test.mjs

  # The lowest three.js in the peer range; unit tests only.
  three-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/viewer
          # PR runs restore main's cache but don't save their own, which would evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/viewer/package-lock.json
      - run: npm ci
      - run: npm install --no-save three@0.162.0 @types/three@0.162.0
      - run: npm run build:wasm
      - run: npx vitest run
