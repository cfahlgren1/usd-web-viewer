name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml pins.
      - run: rustup target add wasm32-unknown-unknown && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PR runs restore main's cache but don't save their own, which would evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: cargo fmt --check
      - run: npm run build:wasm
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      - name: WASM size budget (brotli q11 <= 630 KiB)
        run: |
          node -e "
            const zlib = require('node:zlib');
            const buf = require('node:fs').readFileSync('packages/viewer/wasm/usd_wasm_bg.wasm');
            const size = zlib.brotliCompressSync(buf, { params: { [zlib.constants.BROTLI_PARAM_QUALITY]: 11 } }).length;
            console.log('brotli: ' + (size / 1024).toFixed(1) + ' KiB');
            if (size > 630 * 1024) throw new Error('usd_wasm_bg.wasm brotli is over the 630 KiB budget');
          "
      - run: npx playwright install --with-deps chromium
      - name: Vite example
        working-directory: examples/vite
        run: npm ci && node test.mjs

  # The lowest three.js in the peer range; unit tests only.
  three-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PR runs restore main's cache but don't save their own, which would evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save three@0.162.0 @types/three@0.162.0
      - run: npm run build:wasm
      - run: npm test
